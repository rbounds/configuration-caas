                                  enabled = True
                              }
                              repoServer = {
                                  autoscaling = {
                                      enabled = True
                                      minReplicas = 1
                                  }
                                  metrics = {
                                      enabled = True
                                      service = {
                                          annotations = {
                                              "prometheus.io/scrape" = "true"
                                          }
                                      }
                                  }
                                  resources = {
                                      limits = {
                                          cpu = "200m"
                                          memory = "512Mi"
                                      }
                                      requests = {
                                          cpu = "100m"
                                          memory = "256Mi"
                                      }
                                  }
                              }
                              server = {
                                  autoscaling = {
                                      enabled = True
                                      minReplicas = 1
                                  }
                                  ingress = {
                                      enabled = True
                                  }
                                  metrics = {
                                      enabled = True
                                      service = {
                                          annotations = {
                                              "prometheus.io/scrape" = "true"
                                          }
                                      }
                                  }
                                  resources = {
                                      limits = {
                                          cpu = "200m"
                                          memory = "512Mi"
                                      }
                                      requests = {
                                          cpu = "100m"
                                          memory = "256Mi"
                                      }
                                  }
                                  **({config: {"oidc.config": oidcConfig}} if oidcConfig else {})
                                  **({url: ingressUrl} if ingressUrl else {})
                              }
                              **({global: {domain: ingressUrl}} if ingressUrl else {})
                          }
                      }
                  }
              }
              {
                  apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
                  kind = "Object"
                  metadata = {
                      annotations = {
                          "krm.kcl.dev/composition-resource-name" = "argoApplicationSet"
                      }
                  }
                  spec = {
                      managementPolicies = managementPolicies
                      providerConfigRef = {
                          kind = "ProviderConfig"
                          name = providerConfigName
                      }
                      forProvider = {
                          manifest = {
                              apiVersion = "argoproj.io/v1alpha1"
                              kind = "ApplicationSet"
                              metadata = {
                                  namespace = "argocd"
                                  name = providerConfigName
                              }
                              spec = {
                                  generators = [
