apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: configuration-caas
  annotations:
    meta.crossplane.io/description: Namespaced Kubernetes clusters across AWS, Azure,
      and GCP with GitOps and observability on OSS Crossplane v2.
spec:
  crossplane:
    version: '>=v2.4.0'
  dependsOn:
  - function: xpkg.crossplane.io/crossplane-contrib/function-kcl
    version: v0.12.3
  - function: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
