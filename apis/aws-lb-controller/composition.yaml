# Generated by scripts/generate_composition.py; edit functions/aws-lb-controller/main.k.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: awslbcontrollers.aws.platform.upbound.io
spec:
  compositeTypeRef:
    apiVersion: aws.platform.upbound.io/v1alpha1
    kind: AWSLBController
  mode: Pipeline
  pipeline:
  - step: compose
    functionRef:
      name: crossplane-contrib-function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      spec:
        source: |
          import json

          aws_lb_controller_policy = {
              Version = "2012-10-17"
              Statement = [
                  {
                      Effect = "Allow"
                      Action = [
                          "iam:CreateServiceLinkedRole"
                      ]
                      Resource = "*"
                      Condition = {
                          StringEquals = {
                              "iam:AWSServiceName" = "elasticloadbalancing.amazonaws.com"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "ec2:DescribeAccountAttributes"
                          "ec2:DescribeAddresses"
                          "ec2:DescribeAvailabilityZones"
                          "ec2:DescribeInternetGateways"
                          "ec2:DescribeVpcs"
                          "ec2:DescribeVpcPeeringConnections"
                          "ec2:DescribeSubnets"
                          "ec2:DescribeSecurityGroups"
                          "ec2:DescribeInstances"
                          "ec2:DescribeNetworkInterfaces"
                          "ec2:DescribeTags"
                          "ec2:GetCoipPoolUsage"
                          "ec2:DescribeCoipPools"
                          "elasticloadbalancing:DescribeLoadBalancers"
                          "elasticloadbalancing:DescribeLoadBalancerAttributes"
                          "elasticloadbalancing:DescribeListeners"
                          "elasticloadbalancing:DescribeListenerCertificates"
                          "elasticloadbalancing:DescribeSSLPolicies"
                          "elasticloadbalancing:DescribeRules"
                          "elasticloadbalancing:DescribeTargetGroups"
                          "elasticloadbalancing:DescribeTargetGroupAttributes"
                          "elasticloadbalancing:DescribeTargetHealth"
                          "elasticloadbalancing:DescribeTags"
                          "elasticloadbalancing:DescribeTrustStores"
                      ]
                      Resource = "*"
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "cognito-idp:DescribeUserPoolClient"
                          "acm:ListCertificates"
                          "acm:DescribeCertificate"
                          "iam:ListServerCertificates"
                          "iam:GetServerCertificate"
                          "waf-regional:GetWebACL"
                          "waf-regional:GetWebACLForResource"
                          "waf-regional:AssociateWebACL"
                          "waf-regional:DisassociateWebACL"
                          "wafv2:GetWebACL"
                          "wafv2:GetWebACLForResource"
                          "wafv2:AssociateWebACL"
                          "wafv2:DisassociateWebACL"
                          "shield:GetSubscriptionState"
                          "shield:DescribeProtection"
                          "shield:CreateProtection"
                          "shield:DeleteProtection"
                      ]
                      Resource = "*"
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "ec2:AuthorizeSecurityGroupIngress"
                          "ec2:RevokeSecurityGroupIngress"
                      ]
                      Resource = "*"
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "ec2:CreateSecurityGroup"
                      ]
                      Resource = "*"
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "ec2:CreateTags"
                      ]
                      Resource = "arn:aws:ec2:*:*:security-group/*"
                      Condition = {
                          StringEquals = {
                              "ec2:CreateAction" = "CreateSecurityGroup"
                          }
                          Null = {
                              "aws:RequestTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "ec2:CreateTags"
                          "ec2:DeleteTags"
                      ]
                      Resource = "arn:aws:ec2:*:*:security-group/*"
                      Condition = {
                          Null = {
                              "aws:RequestTag/elbv2.k8s.aws/cluster" = "true"
                              "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "ec2:AuthorizeSecurityGroupIngress"
                          "ec2:RevokeSecurityGroupIngress"
                          "ec2:DeleteSecurityGroup"
                      ]
                      Resource = "*"
                      Condition = {
                          Null = {
                              "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:CreateLoadBalancer"
                          "elasticloadbalancing:CreateTargetGroup"
                      ]
                      Resource = "*"
                      Condition = {
                          Null = {
                              "aws:RequestTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:CreateListener"
                          "elasticloadbalancing:DeleteListener"
                          "elasticloadbalancing:CreateRule"
                          "elasticloadbalancing:DeleteRule"
                      ]
                      Resource = "*"
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:AddTags"
                          "elasticloadbalancing:RemoveTags"
                      ]
                      Resource = [
                          "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"
                          "arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*"
                          "arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*"
                      ]
                      Condition = {
                          Null = {
                              "aws:RequestTag/elbv2.k8s.aws/cluster" = "true"
                              "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:AddTags"
                          "elasticloadbalancing:RemoveTags"
                      ]
                      Resource = [
                          "arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*"
                          "arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*"
                          "arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*"
                          "arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*"
                      ]
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:ModifyLoadBalancerAttributes"
                          "elasticloadbalancing:SetIpAddressType"
                          "elasticloadbalancing:SetSecurityGroups"
                          "elasticloadbalancing:SetSubnets"
                          "elasticloadbalancing:DeleteLoadBalancer"
                          "elasticloadbalancing:ModifyTargetGroup"
                          "elasticloadbalancing:ModifyTargetGroupAttributes"
                          "elasticloadbalancing:DeleteTargetGroup"
                      ]
                      Resource = "*"
                      Condition = {
                          Null = {
                              "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:AddTags"
                      ]
                      Resource = [
                          "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"
                          "arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*"
                          "arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*"
                      ]
                      Condition = {
                          StringEquals = {
                              "elasticloadbalancing:CreateAction" = [
                                  "CreateTargetGroup"
                                  "CreateLoadBalancer"
                              ]
                          }
                          Null = {
                              "aws:RequestTag/elbv2.k8s.aws/cluster" = "false"
                          }
                      }
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:RegisterTargets"
                          "elasticloadbalancing:DeregisterTargets"
                      ]
                      Resource = "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"
                  }
                  {
                      Effect = "Allow"
                      Action = [
                          "elasticloadbalancing:SetWebAcl"
                          "elasticloadbalancing:ModifyListener"
                          "elasticloadbalancing:AddListenerCertificates"
                          "elasticloadbalancing:RemoveListenerCertificates"
                          "elasticloadbalancing:ModifyRule"
                      ]
                      Resource = "*"
                  }
              ]
          }


          oxr = option("params").oxr # observed composite resource
          _ocds = option("params").ocds # observed composed resources
          _dxr = option("params").dxr # desired composite resource
          dcds = option("params").dcds # desired composed resources

          params = oxr.spec.parameters

          _metadata = lambda name: str -> any {
              {
                  name = name
                  annotations = { "krm.kcl.dev/composition-resource-name" = name }
              }
          }

          _defaults = {
              managementPolicies = params.managementPolicies or ["*"]
              if params.providerConfigName:
                  providerConfigName = params.providerConfigName or "default"

          }

          # Get cluster name from observed PodIdentity (only available after it's created)
          _observedClusterName = _ocds?.podidentity?.Resource?.status?.podIdentity?.clusterName

          # Check if PodIdentity is ready by checking if Ready condition exists with True status
          _readyCondition = [condition for condition in (_ocds?.podidentity?.Resource?.status?.conditions or []) if condition.type == "Ready" and condition.status == "True"]
          _isPodIdentityReady = len(_readyCondition) > 0

          # Convert imported KCL policy data back to JSON string
          _awsLbControllerPolicy = json.encode(aws_lb_controller_policy)

          _items = [
              # Pod Identity for AWS Load Balancer Controller
              {
                  apiVersion = "aws.platform.upbound.io/v1alpha1"
                  kind = "PodIdentity"
                  metadata: _metadata("podidentity")
                  spec.parameters = _defaults | {
                      region: params.region
                      serviceAccount: {
                          name: "aws-load-balancer-controller"
                          namespace: "kube-system"
                      }
                      inlinePolicy: [
                          {
                              name: "aws-lb-controller-policy"
                              policy: _awsLbControllerPolicy
                          }
                      ]
                      managementPolicies = params.managementPolicies

                      if params.clusterName:
                          clusterName = params.clusterName
                      if params.clusterNameRef:
                          clusterNameRef = params.clusterNameRef
                      if params.clusterNameSelector:
                          clusterNameSelector = params.clusterNameSelector
                  }
              },

              # Helm Release for AWS Load Balancer Controller
              {
                  apiVersion = "helm.m.crossplane.io/v1beta1"
                  kind = "Release"
                  metadata: _metadata("helmrelease")
                  spec = {
                      forProvider: {
                          chart = {
                              name = params.helm.chart.name
                              repository = params.helm.chart.repo
                              version = params.helm.chart.version
                          }
                          namespace: "kube-system"
                          values: {
                              serviceAccount: {
                                  name: "aws-load-balancer-controller"
                              }
                              # Set replicaCount to 2 when PodIdentity is ready, otherwise 0
                              replicaCount: 2 if _isPodIdentityReady else 0

                              # Only set clusterName if available from observed PodIdentity
                              if _observedClusterName:
                                  clusterName = _observedClusterName

                              # Set VPC ID if provided to avoid EC2 metadata discovery
                              if params.vpcId: vpcId = params.vpcId
                          }
                      }
                      rollbackLimit: 3
                      managementPolicies = params.managementPolicies or ["*"]

                      if params.helm.providerConfigName:
                          providerConfigRef: {
                              kind = "ProviderConfig"
                              name = params.helm.providerConfigName
                          }
                  }
              }

              # Usage resource to ensure proper deletion ordering with EKS clusters
              {
                  apiVersion: "protection.crossplane.io/v1beta1"
                  kind: "Usage"
                  metadata: _metadata("usage-eks-by-awslbcontroller") | {
                      namespace: oxr.metadata.namespace
                  }
                  spec: {
                      replayDeletion: True
                      by: {
                          apiVersion: "helm.m.crossplane.io/v1beta1"
                          kind: "Release"
                          resourceSelector = {
                              matchControllerRef: True
                          }
                      }
                      of: {
                          apiVersion: "aws.platform.upbound.io/v1alpha1"
                          kind: "EKS"
                          resourceRef: {name: params.eksResourceName}
                      }
                  }
              }
          ]

          _raw_items = [item for item in _items if item.kind != "Usage" or params.eksResourceName]

          # All resources are local to the XR. Status patches preserve the XR's identity.
          items = [
              item | {metadata.namespace = oxr.metadata.namespace}
              for item in _raw_items
          ]
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: crossplane-contrib-function-auto-ready
