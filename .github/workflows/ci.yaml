name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Install Crossplane CLI
        run: |
          curl -fsSL https://cli.crossplane.io/stable/v2.4.0/bin/linux_amd64/crossplane -o crossplane
          chmod +x crossplane
          sudo mv crossplane /usr/local/bin/crossplane
      - name: Install YAML tooling
        run: python3 -m pip install -r tests/requirements.txt yamllint
      - name: Build Configuration package
        run: make build
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: configuration-caas
          path: _output/configuration-caas.xpkg
